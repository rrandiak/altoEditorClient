<h2 mat-dialog-title>{{ data.message | translate : (data.messageParams || {}) }}</h2>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ 'button.cancel' | translate }}</button>
  <button mat-flat-button color="primary" (click)="onConfirm()">{{ (data.confirmLabel || 'button.accept') | translate }}</button>
</mat-dialog-actions>
